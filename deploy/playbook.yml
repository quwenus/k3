- name: Provision and Deploy K3 Application
  hosts: web
  become: yes
  tasks:
    - name: Create stable frontend release id
      ansible.builtin.set_fact:
        frontend_release_id: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

    - name: Create stable frontend release path
      ansible.builtin.set_fact:
        frontend_release_dir: "/var/www/k3-app/releases/frontend/{{ frontend_release_id }}"

    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
          - mysql-server
          - nodejs
          - npm
        state: present
        update_cache: yes

    - name: Add Caddy GPG key
      ansible.builtin.shell:
        cmd: curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        state: present
        filename: caddy-stable

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: yes

    - name: Start MySQL service
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: yes

    - name: Create database
      ansible.builtin.shell: mysql -e "CREATE DATABASE IF NOT EXISTS k3_parts CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

    - name: Create database user
      ansible.builtin.shell: mysql -e "CREATE USER IF NOT EXISTS 'admin'@'localhost' IDENTIFIED BY 'shpR1CQtunMLsNPE'; GRANT ALL PRIVILEGES ON k3_parts.* TO 'admin'@'localhost'; FLUSH PRIVILEGES;"

    - name: Copy database schema and seed files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: '0600'
      loop:
        - schema.sql
        - seed.sql

    - name: Import database schema
      ansible.builtin.shell: mysql -u admin -pshpR1CQtunMLsNPE k3_parts < /tmp/schema.sql

    - name: Import database seed data
      ansible.builtin.shell: mysql -u admin -pshpR1CQtunMLsNPE k3_parts < /tmp/seed.sql

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop:
        - /var/www/k3-app
        - /var/www/k3-app/releases
        - /var/www/k3-app/releases/frontend
        - /var/www/k3-app/backend
        - /var/www/k3-app/uploads
        - /var/www/k3-app/uploads/img

    - name: Create frontend release directory
      ansible.builtin.file:
        path: "{{ frontend_release_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy frontend build files
      ansible.posix.synchronize:
        src: ../dist/
        dest: "{{ frontend_release_dir }}/"
        archive: false
        recursive: true
        links: true
        times: true
        delete: true
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

    - name: Verify frontend release has index.html
      ansible.builtin.stat:
        path: "{{ frontend_release_dir }}/index.html"
      register: frontend_index

    - name: Abort if frontend release is incomplete
      ansible.builtin.fail:
        msg: "Frontend release {{ frontend_release_dir }} is incomplete: index.html is missing"
      when: not frontend_index.stat.exists

    - name: Switch frontend release
      ansible.builtin.file:
        src: "{{ frontend_release_dir }}"
        dest: /var/www/k3-app/frontend-current
        state: link
        owner: www-data
        group: www-data
        force: yes

    - name: Copy frontend product images
      ansible.posix.synchronize:
        src: ../src/assets/img/
        dest: /var/www/k3-app/uploads/img/
        archive: false
        recursive: true
        links: true
        times: true
        delete: true
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

    - name: Copy backend files
      ansible.builtin.copy:
        src: "../backend/{{ item }}"
        dest: "/var/www/k3-app/backend/{{ item }}"
        owner: www-data
        group: www-data
        mode: '0644'
      loop:
        - package.json
        - package-lock.json
        - server.js
      notify: Restart backend

    - name: Ensure backend env file exists
      ansible.builtin.file:
        path: /var/www/k3-app/backend/.env
        state: touch
        owner: www-data
        group: www-data
        mode: '0600'

    - name: Update backend core env values
      ansible.builtin.blockinfile:
        path: /var/www/k3-app/backend/.env
        marker: "# {mark} ANSIBLE MANAGED CORE ENV"
        block: |
          PORT=5001
          DB_HOST=127.0.0.1
          DB_USER=admin
          DB_PASSWORD=shpR1CQtunMLsNPE
          DB_NAME=k3_parts
          JWT_SECRET=143d67e4f1ef4f5e8ddb02757b1d69d1148c18ab15b576e1b01a18d5cda0d994dc62c68eb6551fe3ec3fc6926806ebb02080c3e5ba015d2d824f8dcd4910ea0c
          ORDER_RECIPIENT_EMAIL={{ lookup('env', 'ORDER_RECIPIENT_EMAIL') | default('info@k3-parts.ru', true) }}
          UPLOAD_DIR=/var/www/k3-app/uploads/img
          NODE_ENV=production
        owner: www-data
        group: www-data
        mode: '0600'
      notify: Restart backend

    - name: Update backend SMTP env values from local environment
      ansible.builtin.lineinfile:
        path: /var/www/k3-app/backend/.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        owner: www-data
        group: www-data
        mode: '0600'
      loop:
        - key: SMTP_HOST
          value: "{{ lookup('env', 'SMTP_HOST') }}"
        - key: SMTP_PORT
          value: "{{ lookup('env', 'SMTP_PORT') | default('465', true) }}"
        - key: SMTP_SECURE
          value: "{{ lookup('env', 'SMTP_SECURE') | default('true', true) }}"
        - key: SMTP_USER
          value: "{{ lookup('env', 'SMTP_USER') }}"
        - key: SMTP_PASS
          value: "{{ lookup('env', 'SMTP_PASS') }}"
        - key: SMTP_FROM
          value: "{{ lookup('env', 'SMTP_FROM') }}"
      when: item.value | length > 0
      notify: Restart backend

    - name: Install backend dependencies
      ansible.builtin.command:
        cmd: npm install --omit=dev
        chdir: /var/www/k3-app/backend
      environment:
        NODE_ENV: production

    - name: Set permissions
      ansible.builtin.file:
        path: /var/www/k3-app
        state: directory
        recurse: yes
        owner: www-data
        group: www-data

    - name: Copy systemd service file
      ansible.builtin.copy:
        src: k3-backend.service
        dest: /etc/systemd/system/k3-backend.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart backend

    - name: Ensure backend service is running
      ansible.builtin.systemd:
        name: k3-backend
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Copy Caddyfile
      ansible.builtin.copy:
        src: Caddyfile
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      notify: Reload Caddy

    - name: Ensure Caddy is running
      ansible.builtin.service:
        name: caddy
        state: started
        enabled: yes

  handlers:
    - name: Restart backend
      ansible.builtin.systemd:
        name: k3-backend
        state: restarted
        daemon_reload: yes

    - name: Reload Caddy
      ansible.builtin.service:
        name: caddy
        state: reloaded
